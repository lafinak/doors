# ISO 26262-oriented requirement schema for SRD items.
# Ref: ISO 26262-8:2018 (supporting processes) and ISO 26262-6 (software requirements).
# Applied to Doorstop item files; `uid` is derived from the file name.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: SRD Requirement
type: object

required: [uid, level, text, header, asil, status, verification_method, rationale]

properties:
  uid:
    type: string
    pattern: "^[A-Z]{3}[0-9]{3}$"
  level:
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"
  header:
    type: string
    minLength: 3
  text:
    type: string
    pattern: "^The system shall"
    minLength: 20
  asil:
    type: string
    enum: [QM, A, B, C, D]
  status:
    type: string
    enum: [draft, reviewed, approved, obsolete]
  verification_method:
    type: string
    enum: [test, analysis, inspection, demonstration]
  rationale:
    type: string
    minLength: 10
  links:
    type: array
