name: Requirements Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # verify_review_signoff.py uses `git blame`, which needs real history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate requirements (read-only)
        run: python tools/validate.py

      - name: Regression tests
        run: python -m pytest -q tests

      - name: ISO 26262 schema validation
        run: python -I scripts/validate_iso26262.py

      - name: Import trusted reviewer GPG keys
        run: |
          shopt -s nullglob
          for f in keys/*.asc; do gpg --import "$f"; done

      - name: Verify review sign-off (GPG, catches a forged stamp)
        run: python scripts/verify_review_signoff.py

      - name: ReqIF converter smoke test
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke && git init -q
          doorstop create SRD ./reqs/SRD
          python "$GITHUB_WORKSPACE/tools/reqif_to_doorstop.py" "$GITHUB_WORKSPACE/samples/export.reqif" SRD
          test "$(ls reqs/SRD/SRD*.yml | wc -l)" -eq 5

      - name: Publish HTML report
        run: doorstop publish all ./public

      - uses: actions/upload-artifact@v4
        with:
          name: requirements-docs
          path: public/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: public/

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
